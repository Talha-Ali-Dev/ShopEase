<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body>

    <header class="flex justify-center items-center py-4 px-16">
        <nav class="flex justify-between items-center w-full">

            <div class="font-semibold text-lg">Shop<span class="text-electric">Ease</span></div>

            <div class="bg-surface p-4 border border-border rounded-full min-w-150">
                <ul class="flex justify-center items-center gap-10 text-muted text-sm font-medium">
                    <li class="hover:text-electric cursor-pointer">Home</li>
                    <li class="hover:text-electric cursor-pointer">Why us</li>
                    <li class="hover:text-electric cursor-pointer">About</li>
                    <li class="hover:text-electric cursor-pointer">Products</li>
                    <li class="hover:text-electric cursor-pointer">Newsletter</li>
                    <li class="hover:text-electric cursor-pointer">Contact</li>
                </ul>
            </div>

            <div class="flex justify-center items-center gap-3">
                <button class="bg-surface text-text cursor-pointer rounded-full border border-border p-3">
                    <span class="sun">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="text-text">
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
                        </svg>
                    </span>

                    <span class="moon hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="text-text">
                            <path
                                d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.463.402.807a6.5 6.5 0 0 0 8.268 8.268c.344-.215.829-.003.803.397z" />
                        </svg>
                    </span>
                </button>
                <button class="bg-surface text-text cursor-pointer rounded-sm border border-border px-6 py-2">Cart <span
                        class="text-[10px] px-2 py-1 bg-purple-500 rounded-full" id="cart-count">0</span></button>
            </div>

        </nav>
    </header>

    <section class="hero">

    </section>

</body>

</html>
